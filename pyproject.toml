[project]
name = "benneria"
version = "0.1.0"
description = "A small offline web app for Biblical Hebrew and Aramaic: a dictionary and a verse notebook"
readme = "README.md"
authors = [
    { name = "Nicolas Linden", email = "nicolas@nlinden.com" }
]
requires-python = ">=3.9"
# The code is MIT; the two databases in the package keep their own licenses (DATA_LICENSE.md).
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE.md"]
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0 ; sys_platform != 'win32'",
]

[project.scripts]
benneria = "benneria_web:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "text-fabric>=13.1.1",
]
dev = [
    "pytest>=8.4.2",
]

# Four packages: the dictionary, the notebook, the BHS reader, and the combined web app that
# serves all three.
[tool.uv.build-backend]
module-name = ["benneria", "benneria_notebook", "benneria_bhs", "benneria_web"]
