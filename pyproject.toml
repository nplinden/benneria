[project]
name = "benneria"
version = "0.1.0"
description = "A small offline web dictionary for Biblical Hebrew and Aramaic, built on Open Scriptures data"
readme = "README.md"
authors = [
    { name = "Nicolas Linden", email = "nicolas@nlinden.com" }
]
requires-python = ">=3.9"
# The code is MIT; the lexicon database in the package is CC BY 4.0 (DATA_LICENSE.md).
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE.md"]
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0 ; sys_platform != 'win32'",
]

[project.scripts]
benneria = "benneria:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
