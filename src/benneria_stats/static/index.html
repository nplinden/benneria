<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benneria Statistics</title>
<!-- The dictionary's stylesheet (colours, fonts, the entry card), then this page's own styles. -->
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/stats.css">
</head>
<body class="stats">
<main>
  <div class="stats-grid">
    <div class="stats-table-wrap">
      <table class="stats-table">
        <thead><tr id="statsHead"></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
      <div class="stats-pager">
        <button type="button" class="ghost" id="firstPage">« First</button>
        <button type="button" class="ghost" id="prevPage">‹ Prev</button>
        <span id="pageInfo"></span>
        <button type="button" class="ghost" id="nextPage">Next ›</button>
        <button type="button" class="ghost" id="lastPage">Last »</button>
      </div>
    </div>

    <div class="chart-wrap">
      <h2 class="chart-title" id="chartTitle">Every root</h2>
      <div class="chart-rows" id="chartRows"></div>
    </div>
  </div>

  <div class="stats-definitions" id="definitions"></div>
</main>
<footer>
  <p>Verb-form statistics reproduce
    <a href="https://github.com/nplinden/hegram" target="_blank" rel="noopener">hegram</a>'s
    statistics page, over the same
    <a href="https://github.com/ETCBC/bhsa" target="_blank" rel="noopener">BHSA</a> data as the
    notebook and BHS (<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>).
    Definitions are the dictionary's own Strong's and BDB entries.</p>
</footer>
<script src="/static/labels.js"></script>
<script src="/static/entry-card.js"></script>
<script src="/static/stats.js"></script>
</body>
</html>
