<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benneria Connexion</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body.login main {
    max-width: 400px;
  }
  /* The same Garamond as the homepage's title. */
  .login h1 {
    font-family: "EB Garamond", Garamond, "Garamond Premier Pro", "Adobe Garamond Pro", Georgia, serif;
    font-size: 40px;
    font-weight: 500;
    text-align: center;
    margin: 48px 0 8px;
  }
  .login h1 a {
    color: inherit;
    text-decoration: none;
  }
  .login .subtitle {
    text-align: center;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .login form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .login label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  /* Names and passwords are Latin text: the system font, not the Hebrew one style.css gives inputs. */
  .login input {
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
  }
  .login input:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .login .error {  /* coloured by style.css */
    margin: 0;
    font-size: 14px;
  }
  .login .error[hidden] {
    display: none;
  }
</style>
</head>
<body class="login">
<main>
  <h1><a href="/">Benneria</a></h1>
  <p class="subtitle">Connectez-vous pour ouvrir votre cahier.</p>
  <form id="login">
    <label>Nom d'utilisateur
      <input type="text" id="name" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label>Mot de passe
      <input type="password" id="password" autocomplete="current-password" required>
    </label>
    <p class="error" id="error" role="alert" hidden></p>
    <button type="submit" id="submit">Se connecter</button>
  </form>
</main>
<script>
  // Where to go once logged in: the page that sent here, if it is one of this site's own (a path,
  // not "//other.site" or an absolute URL); else the notebook.
  const next = (() => {
    const n = new URLSearchParams(location.search).get("next") || "";
    return /^\/(?![\/\\])/.test(n) ? n : "/notebook";
  })();

  document.querySelector("#login").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const error = document.querySelector("#error"), submit = document.querySelector("#submit");
    error.hidden = true;
    submit.disabled = true;
    try {
      const r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: document.querySelector("#name").value,
                               password: document.querySelector("#password").value }),
      });
      if (r.ok) { location.replace(next); return; }
      error.textContent = (await r.json().catch(() => ({}))).error || `Erreur ${r.status}`;
    } catch {
      error.textContent = "Le serveur ne répond pas.";
    }
    error.hidden = false;
    submit.disabled = false;
    document.querySelector("#password").select();
  });
</script>
</body>
</html>
