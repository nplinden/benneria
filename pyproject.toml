[project]
name = "benneria"
version = "0.1.0"
description = "A small offline web dictionary for Biblical Hebrew and Aramaic, built on Open Scriptures data"
readme = "README.md"
authors = [
    { name = "Nicolas Linden", email = "nicolas@nlinden.com" }
]
requires-python = ">=3.9"
# Ships with the package because the package includes the lexicon database.
license-files = ["DATA_LICENSE.md"]
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
benneria = "benneria:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
